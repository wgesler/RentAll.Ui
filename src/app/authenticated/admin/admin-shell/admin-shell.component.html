<div class="flex content-card-wrap justify-center" fxLayout="row wrap">
  <section class="content-card">
    <div class="flex justify-between items-center gap-3 bg-slate-300 rounded-t-lg py-0 pl-8 pr-4 property-titlebar dbg-band-actions">
      <div class="flex items-center flex-wrap py-4">
        <span class="flex flex-column items-center gap-3 flex-shrink-0">
          <mat-icon class="flex-shrink-0">admin_panel_settings</mat-icon>
          <span class="flex-shrink-0 text-xl font-medium">Admin</span>
        </span>
        <div class="header-title form-titlebar-fields-wrap">
          <app-title-bar-select
            class="admin-organization-select"
            [label]="'Organization'"
            [formFieldClass]="'titlebar-field-office'"
            [value]="organizationId"
            [options]="organizationOptions"
            [noResultsText]="'No organizations match your search'"
            (valueChange)="onOrganizationDropdownChange($event)">
          </app-title-bar-select>
          <app-title-bar-select
            [label]="selectedOfficeId ? 'Office' : 'All Offices'"
            [formFieldClass]="'titlebar-field-office'"
            [value]="selectedOfficeId"
            [options]="officeOptions"
            [nullOptionLabel]="'All Offices'"
            [noResultsText]="'No offices match your search'"
            (valueChange)="onOfficeDropdownChange($event)">
          </app-title-bar-select>
          <div class="admin-shell-titlebar-dates">
            <mat-form-field appearance="outline" class="titlebar-field-office">
              <mat-label>Start Date</mat-label>
              <input
                matInput
                [matDatepicker]="adminStartPicker"
                [(ngModel)]="startDate"
                [ngModelOptions]="{ standalone: true }"
                (dateChange)="onDateRangeChange()"
                [max]="endDate" />
              <mat-datepicker-toggle matIconSuffix [for]="adminStartPicker"></mat-datepicker-toggle>
              <mat-datepicker #adminStartPicker></mat-datepicker>
            </mat-form-field>
            <mat-form-field appearance="outline" class="titlebar-field-office">
              <mat-label>End Date</mat-label>
              <input
                matInput
                [matDatepicker]="adminEndPicker"
                [(ngModel)]="endDate"
                [ngModelOptions]="{ standalone: true }"
                (dateChange)="onDateRangeChange()"
                [min]="startDate" />
              <mat-datepicker-toggle matIconSuffix [for]="adminEndPicker"></mat-datepicker-toggle>
              <mat-datepicker #adminEndPicker></mat-datepicker>
            </mat-form-field>
            <button
              mat-icon-button
              type="button"
              class="admin-shell-date-pin-btn"
              [class.admin-shell-date-pin-btn--active]="dateRangePinned"
              [attr.aria-pressed]="dateRangePinned"
              [attr.aria-label]="dateRangePinned ? 'Unpin top bar' : 'Pin top bar'"
              [matTooltip]="dateRangePinned ? 'Unpin top bar' : 'Keep top bar selections fixed'"
              (click)="toggleDateRangePin()">
              <mat-icon>push_pin</mat-icon>
            </button>
            <button
              mat-mini-fab
              type="button"
              color="primary"
              class="admin-shell-go-btn"
              (click)="runSearch()"
              aria-label="Search receipts"
              matTooltip="Search receipts">
              <span class="admin-shell-go-content">
                <span class="admin-shell-go-label">Go</span>
                <mat-icon class="admin-shell-go-arrow">arrow_forward</mat-icon>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <mat-card>
      <mat-tab-group [selectedIndex]="selectedTabIndex" [animationDuration]="'0ms'" preserveContent class="shell-tabs dbg-band-tabs" (selectedIndexChange)="onTabIndexChange($event)">
        <mat-tab label="Receipts">
          <app-admin-receipts
            [organizationId]="appliedOrganizationId"
            [officeId]="appliedOfficeId"
            [officeIds]="appliedOfficeIds"
            [startDate]="appliedStartDate"
            [endDate]="appliedEndDate"
            [searchNonce]="searchNonce" />
        </mat-tab>
        <mat-tab label="Azure Storage">
          <app-admin-tasks />
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </section>
</div>
