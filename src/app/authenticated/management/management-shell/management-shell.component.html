<div class="flex content-card-wrap justify-center management-shell-wrap">
  <section class="content-card management-shell-card">
    <div class="flex justify-between items-center gap-3 bg-slate-300 rounded-t-lg py-0 pl-8 pr-4 property-titlebar">
      <span class="flex flex-column items-center gap-3 py-4">
        <mat-icon class="flex-shrink-0">manage_accounts</mat-icon>
        <span class="flex-shrink-0 text-xl font-medium">Management</span>
      </span>
    </div>

    <mat-card>
      <mat-tab-group
        class="shell-tabs"
        [selectedIndex]="selectedTabIndex"
        [animationDuration]="'0ms'"
        (selectedIndexChange)="onTabIndexChange($event)">
        <mat-tab label="Tickets">
          @if (selectedTabIndex === 0) {
            <app-ticket-shell />
          }
        </mat-tab>
        <mat-tab label="Maintenance">
          @if (selectedTabIndex === 1) {
            <app-maintenance-shell />
          }
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </section>
</div>
