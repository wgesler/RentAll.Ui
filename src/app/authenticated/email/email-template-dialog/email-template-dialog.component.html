<h2 mat-dialog-title>{{ data.name }}</h2>
<mat-dialog-content>
  @if (data.hasSubject) {
    <mat-form-field appearance="outline" class="email-template-field">
      <mat-label>Subject</mat-label>
      <input matInput [(ngModel)]="subject" maxlength="100" />
    </mat-form-field>
  }
  <mat-form-field appearance="outline" class="email-template-field">
    <mat-label>Content</mat-label>
    <textarea matInput [(ngModel)]="body" rows="16" maxlength="2048"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button type="button" color="primary" (click)="onSave('organization')">Save for organization</button>
  @if (data.canSaveForOffice) {
    <button mat-flat-button type="button" color="accent" (click)="onSave('office')">Save for this office</button>
  }
</mat-dialog-actions>
