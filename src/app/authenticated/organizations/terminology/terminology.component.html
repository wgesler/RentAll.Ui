@if (!isPageReady) {
  <div class="loading-container">
    <mat-spinner [diameter]="40"></mat-spinner>
    <p>Loading term...</p>
  </div>
} @else if (!isServiceError) {
  <div class="flex content-card-wrap justify-center settings-embedded-edit-wrap" fxLayout="row wrap">
    <section class="content-card">
      <mat-card>
        <form id="terminologyForm" [formGroup]="form" (ngSubmit)="saveTerminology()" class="info-form mb-8 form-hide-error-text settings-embedded-edit-top-offset">
          <div class="grid grid-cols-4 form-standard-grid">
            <div class="col-span-4 flex items-center justify-end settings-embedded-edit-actions">
              <button mat-raised-button type="button" color="accent" id="terminology-back-button" (click)="back()" class="text-nowrap flex-shrink-0">
                <mat-icon>arrow_back</mat-icon>
                Back
              </button>
              <button mat-raised-button type="submit" color="primary" id="terminology-save-button" class="text-nowrap flex-shrink-0" [disabled]="isSubmitting || !form.valid">
                <mat-icon>save</mat-icon>
                Save
              </button>
            </div>
            <mat-form-field appearance="outline" class="col-span-2">
              <mat-label>Term</mat-label>
              <input matInput formControlName="term" required>
            </mat-form-field>
            <mat-form-field appearance="outline" class="col-span-2">
              <mat-label>Replacement</mat-label>
              <input matInput formControlName="replacement" required>
            </mat-form-field>
          </div>
        </form>
      </mat-card>
    </section>
  </div>
}
