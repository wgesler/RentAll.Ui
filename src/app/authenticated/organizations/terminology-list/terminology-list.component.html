@if (isPageReady) {
  <div class="mat list-layout-tabbed">
    <div class="tableDiv">
      <app-data-table
        [data]="terminologiesDisplay"
        [columns]="terminologiesDisplayedColumns"
        [hasColumnIndex]="true"
        [hasFilter]="true"
        [hasToggleTop]="false"
        [hasActionsRowClick]="true"
        [hasActionsEdit]="true"
        [hasActionsDelete]="true"
        [deleteConfirmTitle]="'Delete Term'"
        [deleteConfirmMessage]="'Are you sure you want to delete this term?'"
        [itemsPerPage]="10"
        (editEvent)="goToTerminology($event)"
        (rowClickEvent)="goToTerminology($event)"
        (deleteEvent)="deleteTerminology($event)">
        <div dataTableFilterActions>
          <div class="table-filter-actions-group form-titlebar-actions-wrap uniform-gap">
            <button mat-raised-button type="button" color="primary" id="add-terminology-button" (click)="addTerminology()" class="whitespace-nowrap items-center flex gap-1">
              <mat-icon class="text-base">add</mat-icon>
              <span>Add</span>
            </button>
          </div>
        </div>
      </app-data-table>
    </div>
  </div>
}
