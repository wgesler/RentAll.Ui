<app-dashboard-company-data-host />

<div class="flex content-card-wrap justify-center">
  <section class="content-card">
    <app-dashboard-main [titleBarOnly]="true" />

    <mat-card>
      <mat-tab-group
        [selectedIndex]="selectedTabIndex"
        [animationDuration]="'0ms'"
        class="shell-tabs dbg-band-tabs"
        (selectedIndexChange)="onTabIndexChange($event)">
        <mat-tab label="Arrivals">
          @if (selectedTabIndex === 0) {
            <app-dashboard-arrivals-tab />
          }
        </mat-tab>
        <mat-tab label="Departures">
          @if (selectedTabIndex === 1) {
            <app-dashboard-departures-tab />
          }
        </mat-tab>
        <mat-tab label="Online">
          @if (selectedTabIndex === 2) {
            <app-dashboard-online-tab />
          }
        </mat-tab>
        <mat-tab label="Offline">
          @if (selectedTabIndex === 3) {
            <app-dashboard-offline-tab />
          }
        </mat-tab>
        <mat-tab label="Cleaning">
          @if (selectedTabIndex === 4) {
            <app-dashboard-cleaning-tab />
          }
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </section>
</div>
