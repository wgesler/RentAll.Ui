@if (isLoading) {
  <div class="loading-container dbg-band-main">
    <mat-spinner [diameter]="40"></mat-spinner>
    <p>Loading…</p>
  </div>
} @else {
  <div class="dashboard-panel-content dbg-band-main">
    <div class="property-tab-actions-band" aria-hidden="true">
      <div class="property-tab-actions-band__row"></div>
    </div>
    <div class="property-tab-main-area">
      <div class="tableDiv">
        @if (loadFailed) {
          <p class="dashboard-tab-empty">Maintenance items could not be loaded.</p>
        } @else if (rows.length === 0) {
          <p class="dashboard-tab-empty">No properties have maintenance due.</p>
        } @else {
          <app-data-table
            [data]="rows"
            [columns]="columns"
            [subheaderLabel]="''"
            [hasColumnIndex]="true"
            [hasFilter]="true"
            [hasToggleTop]="false"
            [hasButtonTop]="false"
            [hasActionsRowClick]="true"
            [hasActionsEdit]="true"
            [hasActionsDelete]="false"
            [hasPropertyCodeLink]="true"
            [itemsPerPage]="50"
            (editEvent)="goToProperty($event)"
            (rowClickEvent)="goToProperty($event)"
            (propertyCodeClickEvent)="goToProperty($event)">
            <div dataTableFilterActions>
              <span class="filter-row-title">Maintenance Due</span>
            </div>
          </app-data-table>
        }
      </div>
    </div>
  </div>
}
