@if (tabPath === 'receipts' || tabPath === 'work-orders') {
  <div class="mobile-list-actions">
    @if (tabPath === 'receipts') {
      <mat-slide-toggle
        [checked]="showDrafts"
        color="primary"
        class="mobile-receipts-drafts-toggle"
        (change)="onShowDraftsToggle($event.checked)">
        Drafts
      </mat-slide-toggle>
    }
    <button mat-raised-button color="accent" type="button" class="text-nowrap flex-shrink-0" (click)="tabPath === 'receipts' ? addReceipt() : addWorkOrder()">
      <mat-icon>add</mat-icon>
      Add
    </button>
  </div>
}
<app-mobile-list-table
  [rows]="rows"
  [columns]="columns"
  [isPageReady]="isPageReady"
  [showFilter]="showFilter"
  [rowsClickable]="rowsClickable"
  [rowNumberLabel]="showReceiptAttentionColumn ? 'No' : '#'"
  [showAttentionColumn]="showReceiptAttentionColumn"
  (rowClick)="onRowClick($event)" />
