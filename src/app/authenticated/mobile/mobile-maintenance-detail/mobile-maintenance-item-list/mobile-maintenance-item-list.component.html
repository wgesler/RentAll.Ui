@if (isLoading) {
  <div class="mobile-maintenance-line-loading">
    <mat-spinner [diameter]="28"></mat-spinner>
    <span>Loading maintenance items...</span>
  </div>
} @else {
  <div class="mobile-maintenance-lines">
    <div class="mobile-maintenance-lines-header">
      <div class="mobile-maintenance-lines-actions">
        <button mat-raised-button color="accent" type="button" (click)="addRow()">
          <mat-icon>add</mat-icon>
          Add
        </button>
        <button mat-raised-button color="primary" type="button" (click)="saveRequested.emit()" [disabled]="isSaving">
          <mat-icon>save</mat-icon>
          Save
        </button>
      </div>
    </div>

    <div class="mobile-maintenance-lines-list">
      @if (!rows || rows.length === 0) {
        <div class="mobile-maintenance-line-empty">No maintenance items found for this property.</div>
      } @else {
        @for (row of rows; track trackByRowId($index, row); let rowIndex = $index) {
          <div class="mobile-maintenance-line-card">
            <div class="mobile-maintenance-line-card-header">
              <span class="mobile-maintenance-line-no">No: {{ rowIndex + 1 }}</span>
              <button
                type="button"
                mat-icon-button
                color="accent"
                (click)="removeRow(row)"
                [disabled]="isSaving"
                matTooltip="Remove this item"
                aria-label="Remove maintenance item">
                <mat-icon>close</mat-icon>
              </button>
            </div>

            <mat-form-field
              appearance="outline"
              class="mobile-maintenance-line-field"
              [class.mat-form-field-invalid]="showFieldError(isNameMissing(row))"
              [class.mat-mdc-form-field-invalid]="showFieldError(isNameMissing(row))">
              <mat-label>Name *</mat-label>
              <input
                matInput
                type="text"
                [(ngModel)]="row.name"
                [ngModelOptions]="{ standalone: true }"
                [name]="'maintenance-item-name-' + row.rowId" />
            </mat-form-field>

            <mat-form-field
              appearance="outline"
              class="mobile-maintenance-line-field"
              [class.mat-form-field-invalid]="showFieldError(isLastServicedOnMissing(row))"
              [class.mat-mdc-form-field-invalid]="showFieldError(isLastServicedOnMissing(row))">
              <mat-label>Last Serviced *</mat-label>
              <input
                matInput
                [matDatepicker]="lastServicedPicker"
                placeholder="MM/DD/YYYY"
                [(ngModel)]="row.lastServicedOn"
                (dateChange)="onLastServicedOnDateChange(row, $event.value)"
                (blur)="onLastServicedOnBlur(row)"
                [ngModelOptions]="{ standalone: true }"
                [name]="'maintenance-item-last-serviced-' + row.rowId" />
              <mat-datepicker-toggle matIconSuffix [for]="lastServicedPicker"></mat-datepicker-toggle>
              <mat-datepicker #lastServicedPicker></mat-datepicker>
            </mat-form-field>

            <mat-form-field
              appearance="outline"
              class="mobile-maintenance-line-field"
              [class.mat-form-field-invalid]="showFieldError(isMonthsMissing(row))"
              [class.mat-mdc-form-field-invalid]="showFieldError(isMonthsMissing(row))">
              <mat-label>Months *</mat-label>
              <input
                matInput
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                [ngModel]="row.monthsBetweenService ?? ''"
                (ngModelChange)="onMonthsBetweenServiceInput(row, $event)"
                [ngModelOptions]="{ standalone: true }"
                [name]="'maintenance-item-months-' + row.rowId" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="mobile-maintenance-line-field mobile-maintenance-line-notes-field">
              <mat-label>Notes</mat-label>
              <textarea
                matInput
                rows="2"
                [(ngModel)]="row.notes"
                [ngModelOptions]="{ standalone: true }"
                [name]="'maintenance-item-notes-' + row.rowId"></textarea>
            </mat-form-field>
          </div>
        }
      }
    </div>
  </div>
}
