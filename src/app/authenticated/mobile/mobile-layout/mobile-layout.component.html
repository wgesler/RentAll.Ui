@if (!(hidePrimaryChrome$ | async)) {
  <app-header />
}
<app-mobile-sidebar />
@if (receiptCaptureInProgress$ | async) {
  <app-receipt-reading-overlay />
}
@if (showPendingReceiptDraftsPrompt) {
  <app-pending-receipt-drafts-prompt
    (confirmed)="onPendingReceiptDraftsPromptYes()"
    (dismissed)="onPendingReceiptDraftsPromptNo()" />
}
