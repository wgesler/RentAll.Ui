<div class="flex content-card-wrap justify-center items-start">
  <section class="content-card">
    <div class="flex justify-between items-center gap-3 rounded-t-lg bg-slate-300 py-0 pl-8 pr-4 property-titlebar dbg-band-actions">
      <div class="flex items-center flex-wrap py-4">
        <span class="flex flex-shrink-0 items-center gap-2">
          <mat-icon class="flex-shrink-0">receipt_long</mat-icon>
          <span class="flex-shrink-0 text-xl font-medium">Billing</span>
        </span>
        <div class="header-title form-titlebar-fields-wrap">
          <app-title-bar-select
            [label]="'Organization'"
            [formFieldClass]="'titlebar-field-company'"
            [value]="selectedOrganizationId"
            [options]="organizationTitleBarOptions"
            [nullOptionLabel]="'Select Organization'"
            [noResultsText]="'No organizations match your search'"
            (valueChange)="onOrganizationDropdownChange($event)">
          </app-title-bar-select>
        </div>
      </div>
      @if (activeInvoiceId) {
        <div class="form-titlebar-actions-wrap uniform-gap">
          <button mat-raised-button type="button" color="accent" id="billing-shell-back-button" class="text-nowrap flex-shrink-0" (click)="closeEmbeddedInvoiceEditor(true)">
            <mat-icon>arrow_back</mat-icon>
            Back
          </button>
        </div>
      }
    </div>

    <mat-card>
      <div class="dbg-band-main">
        @if (activeInvoiceId) {
          @for (instance of [invoiceDetailInstance]; track instance) {
            <app-invoice
              [shellMode]="true"
              [embedDocumentPreviewInShell]="true"
              [invoiceIdInput]="activeInvoiceId"
              [prefetchedInvoice]="selectedInvoice"
              [officeIdInput]="selectedOfficeId"
              [reservationIdInput]="selectedReservationId || selectedOrganizationId"
              [companyIdInput]="selectedCompanyId"
              (invoiceCreated)="onInvoiceCreated()">
            </app-invoice>
          }
        } @else {
          <app-invoice-list
            [source]="'billing'"
            [embedDocumentPreviewInShell]="true"
            [organizationId]="selectedOrganizationId"
            [organizationName]="selectedOrganizationName"
            [organizationOptions]="organizationTitleBarOptions"
            [officeId]="null"
            [reservationId]="null"
            [companyId]="null"
            [refreshTrigger]="invoicesRefreshTrigger"
            (organizationIdChange)="onInvoiceOrganizationChange($event)"
            (invoiceSelect)="onInvoiceSelect($event)">
          </app-invoice-list>
        }
      </div>
    </mat-card>
  </section>
</div>
