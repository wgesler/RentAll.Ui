<ng-template #billReportActionButtons>
  <button mat-raised-button type="button" color="accent" (click)="onPrint()" [disabled]="!previewIframeHtml">
    <mat-icon>print</mat-icon>
    Print
  </button>
  <button mat-raised-button type="button" color="accent" (click)="onEmail()" [disabled]="!previewIframeHtml">
    <mat-icon>email</mat-icon>
    Email
  </button>
  <button mat-raised-button type="button" color="accent" (click)="onDownload()" [disabled]="!previewIframeHtml || isDownloading">
    <mat-icon>download</mat-icon>
    {{ isDownloading ? 'Downloading...' : 'Download' }}
  </button>
  <button mat-raised-button type="button" color="primary" (click)="saveDocument()" [disabled]="!previewIframeHtml || isSubmitting">
    <mat-icon>save</mat-icon>
    {{ isSubmitting ? 'Saving...' : 'Document' }}
  </button>
</ng-template>

@if (isLoading) {
  <div class="loading-container loading-container--section">
    <mat-spinner [diameter]="40"></mat-spinner>
    <p>Rendering bill report...</p>
  </div>
} @else if (loadFailed) {
  <p class="empty-msg">Unable to build the bill report.</p>
} @else if (previewIframeHtml) {
  @if (shellMode) {
    <div class="property-tab-actions-band">
      <div class="property-tab-actions-band__row">
        <div class="table-filter-actions-group form-titlebar-actions-wrap uniform-gap">
          <ng-container *ngTemplateOutlet="billReportActionButtons"></ng-container>
        </div>
      </div>
    </div>
    <div class="property-tab-main-area">
      <div class="document-preview-frame">
        <iframe
          [srcdoc]="safePreviewIframeHtml"
          class="document-preview-iframe preview-iframe"
          #previewIframe
          [attr.key]="iframeKey"
          (load)="onPreviewIframeLoad()"
          frameborder="0">
        </iframe>
      </div>
    </div>
  } @else {
    <div class="document-preview-editor">
      <div class="document-preview-actions form-titlebar-actions-wrap uniform-gap">
        <ng-container *ngTemplateOutlet="billReportActionButtons"></ng-container>
      </div>
      <div class="document-preview-frame">
        <iframe
          [srcdoc]="safePreviewIframeHtml"
          class="document-preview-iframe preview-iframe"
          #previewIframe
          [attr.key]="iframeKey"
          (load)="onPreviewIframeLoad()"
          frameborder="0">
        </iframe>
      </div>
    </div>
  }
}
