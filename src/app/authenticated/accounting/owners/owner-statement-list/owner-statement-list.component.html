@if (isLoading) {
  <div class="loading-container">
    <mat-spinner [diameter]="40"></mat-spinner>
    <p>Loading owner statements...</p>
  </div>
} @else if (!isPageReady) {
  <div class="loading-container">
    <mat-spinner [diameter]="40"></mat-spinner>
    <p>Loading owner statement list...</p>
  </div>
} @else if (isServiceError) {
  <p class="owner-statement-list-error">Unable to load owner statement list.</p>
} @else {
  <div class="mat list-layout-standard owner-statement-layout owner-statement-layout--list">
    <div class="owner-statement-context-band property-tab-actions-band dbg-band-actions">
      <div class="property-tab-actions-band__row owner-statement-context-band__row">
        <div class="owner-statement-context-band__titles">
          <p class="owner-statement-report-title">{{ reportTitle }}</p>
          <button type="button" class="owner-statement-context-btn">
            @if (headerEntityLine) {
              <span class="owner-statement-context-btn__entity">{{ headerEntityLine }}</span>
            }
            <span class="owner-statement-context-btn__period">{{ headerPeriodLine }}</span>
          </button>
        </div>
      </div>
    </div>
    <div class="tableDiv">
      <app-data-table
        tableName="owner-statement-list"
        [data]="lines"
        [columns]="ownerStatementDisplayedColumns"
        [totalsRow]="totalsRow"
        [totalsLabel]="'Totals:'"
        [hasColumnIndex]="true"
        [hasFilter]="true"
        [hasActionsSelect]="true"
        [hasButtonSelectAll]="true"
        [hasActionsView]="true"
        [hasActionsPrint]="true"
        [hasActionsDownload]="true"
        [downloadActionColor]="'#FFC107'"
        [downloadActionTooltip]="'Download'"
        [hasActionsRowClick]="!showToBePaidColumn"
        [noDataMessage]="noDataMessage"
        [itemsPerPage]="10"
        (rowClickEvent)="onViewStatement($event)"
        (viewEvent)="onViewStatement($event)"
        (printEvent)="printOwnerStatement($event)"
        (downloadEvent)="downloadOwnerStatement($event)"
        (selectionSet)="onSelectionSet($event)"
        (inlineEditChangeEvent)="onInlineToBePaidChange($event)">
          <div dataTableFilterActions>
            <div class="table-filter-actions-group form-titlebar-actions-wrap uniform-gap">
              <button mat-raised-button type="button" color="accent" id="pay-owners-button" class="whitespace-nowrap items-center flex gap-1" (click)="onPayOwners()" [disabled]="isPayingOwners">
                <mat-icon class="text-base">attach_money</mat-icon>
                <span>Pay Owners</span>
              </button>
              <button mat-raised-button type="button" color="primary" id="download-owner-statements-button" class="whitespace-nowrap items-center flex gap-1" (click)="downloadSelectedOwnerStatements()" [disabled]="selectedOwnerStatementLines.length === 0 || isDownloadingOwnerStatements">
                <mat-icon class="text-base">file_download</mat-icon>
                <span>{{ isDownloadingOwnerStatements ? 'Downloading...' : 'Download' }}</span>
              </button>
            </div>
          </div>
      </app-data-table>
    </div>
  </div>
}
